<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Dark Backplate Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111119" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Neon Gradients representing Relay Flow -->
    <linearGradient id="relay-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="relay-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="relay-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b180ff" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Deep Multi-Layer Neon Glow -->
    <filter id="super-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4facfe" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff0844" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Backplate -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />

  <!-- Highly Unique Two-Way Interlocking Signal Relay Wave Emblem (scaled down for safe-area maskable compliance) -->
  <g filter="url(#super-glow)" transform="translate(51, 51) scale(0.8)">
    <!-- Set A: Signals Radiating from Bottom-Left -->
    <!-- Wave A2 (Outer Cyan Wave) -->
    <path d="M 150 192 A 170 170 0 0 1 320 362" fill="none" stroke="url(#relay-cyan)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Wave A1 (Inner Purple Wave) -->
    <path d="M 150 272 A 90 90 0 0 1 240 362" fill="none" stroke="url(#relay-purple)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Seed Node A (Bottom-Left Glowing Circle) -->
    <circle cx="150" cy="362" r="28" fill="url(#relay-magenta)" />

    <!-- Set B: Signals Radiating from Top-Right -->
    <!-- Wave B2 (Outer Magenta Wave) -->
    <path d="M 362 320 A 170 170 0 0 1 192 150" fill="none" stroke="url(#relay-magenta)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Wave B1 (Inner Purple Wave) -->
    <path d="M 362 240 A 90 90 0 0 1 272 150" fill="none" stroke="url(#relay-purple)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Seed Node B (Top-Right Glowing Circle) -->
    <circle cx="362" cy="150" r="28" fill="url(#relay-cyan)" />
  </g>
</svg>
