<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Dark Backplate Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111119" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Neon Gradients representing Relay Flow -->
    <linearGradient id="relay-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="relay-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="relay-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b180ff" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Deep Multi-Layer Neon Glow -->
    <filter id="super-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4facfe" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff0844" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Backplate -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />

  <!-- Highly Unique Interlocking 3D Relay Emblem (scaled down for safe-area maskable compliance) -->
  <g filter="url(#super-glow)" transform="translate(51, 51) scale(0.8)">
    <!-- Outer Curved Ribbon Loop (forms the loop of the R) -->
    <path d="M 210 100 H 290 C 360 100 395 140 395 220 C 395 300 360 320 290 320 H 210 L 210 260 H 280 C 320 260 335 245 335 220 C 335 195 320 160 280 160 H 210 Z" fill="url(#relay-cyan)" />
    
    <!-- Left Vertical Pillar (forms the solid left backbone) -->
    <path d="M 145 130 C 145 115 157 100 175 100 H 210 V 412 H 175 C 157 412 145 397 145 382 Z" fill="url(#relay-magenta)" opacity="0.95" />
    
    <!-- Sweeping Diagonal Ribbon Leg (forms the leg of the R) -->
    <path d="M 245 285 L 340 397 C 350 409 365 412 385 412 H 400 C 410 412 415 400 405 390 L 295 280 Z" fill="url(#relay-purple)" opacity="0.9" />
  </g>
</svg>
