<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Stylized Brand D Emblem (scaled down for safe-area maskable compliance) -->
  <g filter="url(#glow)" transform="translate(51, 51) scale(0.8)">
    <path fill-rule="evenodd" d="M170 120 H290 C360 120 385 170 385 256 C385 342 360 392 290 392 H170 C155 392 145 382 145 367 V145 C145 130 155 120 170 120 Z M210 170 V342 H280 C325 342 335 310 335 256 C335 202 325 170 280 170 H210 Z" fill="#ffffff" />
  </g>
</svg>
