<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Coral-Pink → Purple → Indigo gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Prism facet fills -->
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="facet-top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="facet-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f0abfc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.5" />
    </linearGradient>

    <!-- Rainbow refraction beam -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sparkle glow -->
    <filter id="sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable (no border radius) -->
  <rect width="512" height="512" rx="0" fill="url(#bg)" />

  <!-- Subtle ambient light circle behind prism -->
  <circle cx="256" cy="240" r="120" fill="white" opacity="0.06" />

  <!-- Prism and effects scaled down for maskable safe zone -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Rainbow refraction beam emerging from prism right side -->
    <g opacity="0.7">
      <polygon points="310,250 440,200 440,220" fill="#ef4444" opacity="0.4" />
      <polygon points="310,255 440,220 440,238" fill="#f59e0b" opacity="0.35" />
      <polygon points="310,260 440,238 440,256" fill="#fbbf24" opacity="0.35" />
      <polygon points="310,265 440,256 440,274" fill="#22c55e" opacity="0.35" />
      <polygon points="310,270 440,274 440,292" fill="#3b82f6" opacity="0.35" />
      <polygon points="310,275 440,292 440,310" fill="#8b5cf6" opacity="0.35" />
      <polygon points="310,280 440,310 440,328" fill="#ec4899" opacity="0.3" />
    </g>

    <!-- Incoming light beam from left -->
    <polygon points="72,248 200,256 200,264 72,272" fill="white" opacity="0.35" />

    <!-- Main Prism Shape -->
    <g filter="url(#glow)">
      <!-- Left facet -->
      <polygon points="256,120 180,340 256,300" fill="url(#facet-left)" stroke="white" stroke-opacity="0.3" stroke-width="1.5" />

      <!-- Right facet -->
      <polygon points="256,120 332,340 256,300" fill="url(#facet-right)" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

      <!-- Bottom facet (visible base) -->
      <polygon points="180,340 332,340 256,300" fill="url(#facet-inner)" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

      <!-- Top highlight facet (inner refraction) -->
      <polygon points="256,145 212,280 256,265 300,280" fill="url(#facet-top)" opacity="0.3" />
    </g>

    <!-- Edge highlight lines for premium glass feel -->
    <line x1="256" y1="120" x2="180" y2="340" stroke="white" stroke-opacity="0.4" stroke-width="1.2" />
    <line x1="256" y1="120" x2="332" y2="340" stroke="white" stroke-opacity="0.35" stroke-width="1.2" />
    <line x1="180" y1="340" x2="332" y2="340" stroke="white" stroke-opacity="0.25" stroke-width="1.2" />
    <line x1="256" y1="120" x2="256" y2="300" stroke="white" stroke-opacity="0.12" stroke-width="0.8" />

    <!-- Small sparkle highlights -->
    <g filter="url(#sparkle)">
      <circle cx="248" cy="152" r="3.5" fill="white" opacity="0.9" />
      <circle cx="200" cy="280" r="2.5" fill="white" opacity="0.5" />
      <circle cx="310" cy="300" r="2" fill="white" opacity="0.45" />
      <circle cx="268" cy="200" r="2" fill="#fde68a" opacity="0.6" />
    </g>
  </g>
</svg>
