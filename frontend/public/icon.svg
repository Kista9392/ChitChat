<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Lush warm gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="35%" stop-color="#6d28d9" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Secondary accent gradient -->
    <linearGradient id="accent-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Crystal facet fills with rich translucency -->
    <linearGradient id="f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="f2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="f3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#f0abfc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="f4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2" />
    </linearGradient>

    <!-- Inner crystal rainbow shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.4" />
      <stop offset="33%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="66%" stop-color="#67e8f9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Rainbow dispersion beams -->
    <linearGradient id="beam-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>

    <!-- Incoming light beam gradient -->
    <linearGradient id="light-in" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="big-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle radial light behind prism -->
  <circle cx="256" cy="246" r="140" fill="white" opacity="0.05" />
  <circle cx="256" cy="246" r="80" fill="white" opacity="0.04" />

  <!-- Incoming light beam -->
  <polygon points="50,238 195,253 195,259 50,274" fill="url(#light-in)" />

  <!-- Rainbow dispersion beams with gradient fade -->
  <g>
    <polygon points="318,230 462,160 462,175" fill="url(#beam-red)" />
    <polygon points="318,238 462,180 462,195" fill="url(#beam-orange)" />
    <polygon points="318,246 462,200 462,215" fill="url(#beam-yellow)" />
    <polygon points="318,254 462,220 462,235" fill="url(#beam-green)" />
    <polygon points="318,262 462,240 462,255" fill="url(#beam-blue)" />
    <polygon points="318,270 462,260 462,275" fill="url(#beam-violet)" />
  </g>

  <!-- Ambient color glow behind prism -->
  <circle cx="256" cy="256" r="100" fill="#a78bfa" opacity="0.08" filter="url(#big-glow)" />

  <!-- Main Crystal Prism -->
  <g filter="url(#glow)">
    <!-- Left face -->
    <polygon points="256,108 172,365 256,310" fill="url(#f1)" />
    <!-- Right face -->
    <polygon points="256,108 340,365 256,310" fill="url(#f2)" />
    <!-- Bottom face -->
    <polygon points="172,365 340,365 256,310" fill="url(#f3)" />
    <!-- Inner refraction highlight -->
    <polygon points="256,140 205,295 256,278 307,295" fill="url(#shimmer)" />
    <!-- Center vertical light catch -->
    <polygon points="252,135 256,310 260,135" fill="white" opacity="0.12" />
  </g>

  <!-- Glass edge highlights -->
  <g stroke="white" fill="none" stroke-linecap="round">
    <line x1="256" y1="108" x2="172" y2="365" stroke-opacity="0.5" stroke-width="1.8" />
    <line x1="256" y1="108" x2="340" y2="365" stroke-opacity="0.45" stroke-width="1.8" />
    <line x1="172" y1="365" x2="340" y2="365" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Inner structural line -->
    <line x1="256" y1="108" x2="256" y2="310" stroke-opacity="0.15" stroke-width="1" />
    <line x1="172" y1="365" x2="256" y2="310" stroke-opacity="0.2" stroke-width="1" />
    <line x1="340" y1="365" x2="256" y2="310" stroke-opacity="0.18" stroke-width="1" />
  </g>

  <!-- Sparkle highlights for premium glass feel -->
  <g filter="url(#spark)">
    <!-- Apex sparkle -->
    <circle cx="253" cy="118" r="4.5" fill="white" opacity="0.95" />
    <circle cx="260" cy="112" r="2" fill="white" opacity="0.6" />
    <!-- Left edge sparkle -->
    <circle cx="198" cy="270" r="2.5" fill="white" opacity="0.5" />
    <!-- Right face sparkle -->
    <circle cx="310" cy="290" r="2" fill="#fde68a" opacity="0.55" />
    <!-- Bottom sparkle -->
    <circle cx="256" cy="355" r="2" fill="#67e8f9" opacity="0.4" />
    <!-- Inner sparkle -->
    <circle cx="240" cy="210" r="1.5" fill="#f9a8d4" opacity="0.5" />
    <circle cx="275" cy="235" r="1.8" fill="white" opacity="0.45" />
  </g>

  <!-- Tiny floating particles for depth -->
  <g opacity="0.25">
    <circle cx="380" cy="180" r="1.5" fill="white" />
    <circle cx="400" cy="210" r="1" fill="white" />
    <circle cx="130" cy="260" r="1.2" fill="white" />
    <circle cx="110" cy="240" r="0.8" fill="white" />
    <circle cx="390" cy="310" r="1" fill="white" />
  </g>
</svg>
