<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant sunset gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="50%" stop-color="#feb47b" />
      <stop offset="75%" stop-color="#c655b3" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Orbit trail gradients -->
    <linearGradient id="orbit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbcfe8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbit2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbit3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sphere gradients (pearl-like) -->
    <radialGradient id="sphere1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ec4899" />
    </radialGradient>

    <radialGradient id="sphere2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </radialGradient>

    <radialGradient id="sphere3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Glow filters -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background with large rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Ambient background glow behind the shapes -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.15" filter="url(#glow-ambient)" />

  <g filter="url(#glow-strong)">
    <!-- Orbit 1 (Tilted left) -->
    <g transform="translate(256, 256) rotate(30) translate(-256, -256)">
      <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#orbit1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="100" />
      <!-- Sphere on orbit 1 -->
      <circle cx="96" cy="256" r="24" fill="url(#sphere1)" />
      <!-- Tiny trailing particles -->
      <circle cx="130" cy="210" r="4" fill="#ffffff" opacity="0.8" />
      <circle cx="150" cy="195" r="2" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Orbit 2 (Tilted right) -->
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
      <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#orbit2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="200" />
      <!-- Sphere on orbit 2 -->
      <circle cx="416" cy="256" r="20" fill="url(#sphere2)" />
      <!-- Tiny trailing particles -->
      <circle cx="380" cy="300" r="3.5" fill="#ffffff" opacity="0.8" />
      <circle cx="360" cy="310" r="1.5" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Orbit 3 (Vertical) -->
    <g transform="translate(256, 256) rotate(90) translate(-256, -256)">
      <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#orbit3)" stroke-width="8" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="300" />
      <!-- Sphere on orbit 3 -->
      <circle cx="106" cy="275" r="16" fill="url(#sphere3)" />
      <!-- Tiny trailing particles -->
      <circle cx="120" cy="240" r="3" fill="#ffffff" opacity="0.8" />
      <circle cx="135" cy="225" r="1.5" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Central energy core connecting them -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.95" />
    <circle cx="256" cy="256" r="45" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Highlighting sparkles overlay -->
  <circle cx="245" cy="245" r="5" fill="#ffffff" />
  <circle cx="88" cy="250" r="4" fill="#ffffff" transform="rotate(30 256 256)" />
  <circle cx="408" cy="250" r="4" fill="#ffffff" transform="rotate(-45 256 256)" />
</svg>
