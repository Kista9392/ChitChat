spring:
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB
  application:
    name: backend

  # Database Connection (Neon DB - PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Required for Neon DB serverless connections
      connection-init-sql: SELECT 1

  # Hibernate (JPA) Settings
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # Redis Connection (Upstash - always SSL)
  data:
    redis:
      url: ${SPRING_REDIS_URL}
      ssl:
        enabled: true
      connect-timeout: 10000
      timeout: 10000

  # Mail Server Setup
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:noreply@example.com}
    password: ${SPRING_MAIL_PASSWORD:placeholder}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

  # OAuth2 Setup (Google Login)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-set}
            scope: email, profile

logging:
  level:
    org.hibernate.SQL: ERROR
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
    com.social.backend: INFO

server:
  port: ${PORT:7860}
  error:
    include-message: always

app:
  api-url: ${APP_API_URL:http://localhost:7860}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a756b5c8d0a061}
  encryption-key: ${ENCRYPTION_KEY:ThisIsASecretKey}

google:
  oauth:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
